
name: Build Saman Windows

on:
  workflow_dispatch: 

jobs:
  build:
    # برای C# و برنامه‌های ویندوزی حتماً باید روی ویندوز بیلد بشه
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # نسخه دات‌نت رو اینجا بذار (مثلاً 8.0.x یا 6.0.x)
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore
